<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI',Roboto,sans-serif;">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Title Banner -->
  <rect x="20" y="20" width="860" height="50" rx="10" fill="#EBF3FC" stroke="#2E86DE" stroke-width="1.5"/>
  <text x="450" y="52" text-anchor="middle" font-size="18" font-weight="700" fill="#1E66B4">AquaSense WQMS — Hardware Wiring &amp; Circuit Connection Schematic</text>

  <!-- ESP32 DevKit V1 Board -->
  <g transform="translate(320, 100)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="260" height="320" rx="14" fill="#1F2937" stroke="#111827" stroke-width="2"/>
    <!-- USB Port -->
    <rect x="95" y="-12" width="70" height="18" rx="4" fill="#9CA3AF" stroke="#6B7280" stroke-width="1.5"/>
    <text x="130" y="2" text-anchor="middle" font-size="9" font-weight="600" fill="#374151">USB 5V</text>

    <!-- Wi-Fi Antenna -->
    <rect x="70" y="20" width="120" height="35" rx="6" fill="#374151"/>
    <text x="130" y="42" text-anchor="middle" font-size="11" font-weight="700" fill="#9CA3AF">2.4GHz Wi-Fi / BLE</text>

    <!-- Chip Label -->
    <text x="130" y="95" text-anchor="middle" font-size="16" font-weight="800" fill="#FFFFFF">ESP32 DevKit V1</text>
    <text x="130" y="115" text-anchor="middle" font-size="10" fill="#9CA3AF">Dual-Core Tensilica LX6</text>

    <!-- Pin Headers Left -->
    <g transform="translate(10, 140)">
      <rect x="0" y="0" width="40" height="24" rx="4" fill="#DC2626"/>
      <text x="20" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">3V3</text>

      <rect x="0" y="35" width="40" height="24" rx="4" fill="#374151"/>
      <text x="20" y="51" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">GND</text>

      <rect x="0" y="70" width="40" height="24" rx="4" fill="#2563EB"/>
      <text x="20" y="86" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">IO 34</text>

      <rect x="0" y="105" width="40" height="24" rx="4" fill="#7C3AED"/>
      <text x="20" y="121" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">IO 35</text>

      <rect x="0" y="140" width="40" height="24" rx="4" fill="#D97706"/>
      <text x="20" y="156" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">IO 32</text>
    </g>

    <!-- Pin Headers Right -->
    <g transform="translate(210, 140)">
      <rect x="0" y="0" width="40" height="24" rx="4" fill="#059669"/>
      <text x="20" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">IO 4</text>
      <text x="-40" y="16" text-anchor="end" font-size="10" fill="#9CA3AF">1-Wire</text>
    </g>
  </g>

  <!-- Sensor 1: TDS Sensor (Left Top) -->
  <g transform="translate(40, 110)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="200" height="70" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="100" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">TDS Sensor SEN0244</text>
    <text x="100" y="42" text-anchor="middle" font-size="10" fill="#6B7280">Signal Conditioning Board</text>
    <text x="100" y="60" text-anchor="middle" font-size="10" font-weight="600" fill="#2563EB">AOUT → GPIO 34 (ADC1)</text>
  </g>

  <!-- Sensor 2: pH Sensor (Left Middle) -->
  <g transform="translate(40, 200)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="200" height="70" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <text x="100" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#5B21B6">pH Sensor E-201-C</text>
    <text x="100" y="42" text-anchor="middle" font-size="10" fill="#6B7280">BNC Glass Electrode</text>
    <text x="100" y="60" text-anchor="middle" font-size="10" font-weight="600" fill="#7C3AED">AOUT → GPIO 35 (ADC1)</text>
  </g>

  <!-- Sensor 3: Turbidity Sensor (Left Bottom) -->
  <g transform="translate(40, 290)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="200" height="70" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
    <text x="100" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">Turbidity SEN0189</text>
    <text x="100" y="42" text-anchor="middle" font-size="10" fill="#6B7280">Optical Transmittance</text>
    <text x="100" y="60" text-anchor="middle" font-size="10" font-weight="600" fill="#D97706">AOUT → GPIO 32 (ADC1)</text>
  </g>

  <!-- Sensor 4: DS18B20 Temp Sensor (Right) -->
  <g transform="translate(660, 200)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="200" height="100" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
    <text x="100" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#065F46">DS18B20 Temperature</text>
    <text x="100" y="42" text-anchor="middle" font-size="10" fill="#6B7280">Stainless Steel Probe</text>
    <text x="100" y="62" text-anchor="middle" font-size="10" font-weight="600" fill="#059669">DATA → GPIO 4 (1-Wire)</text>
    <rect x="20" y="74" width="160" height="18" rx="4" fill="#FEF3C7"/>
    <text x="100" y="87" text-anchor="middle" font-size="9" font-weight="700" fill="#B45309">+ 4.7kΩ Pull-up to 3.3V</text>
  </g>

  <!-- Connecting Wires -->
  <!-- Wire 1: TDS -> IO 34 -->
  <path d="M 240 145 L 290 145 L 290 222 L 330 222" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-dasharray="4 2"/>
  <!-- Wire 2: pH -> IO 35 -->
  <path d="M 240 235 L 280 235 L 280 257 L 330 257" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-dasharray="4 2"/>
  <!-- Wire 3: Turbidity -> IO 32 -->
  <path d="M 240 325 L 290 325 L 290 292 L 330 292" fill="none" stroke="#D97706" stroke-width="2.5" stroke-dasharray="4 2"/>
  <!-- Wire 4: Temp -> IO 4 -->
  <path d="M 660 250 L 590 250 L 590 152 L 570 152" fill="none" stroke="#059669" stroke-width="2.5"/>

  <!-- Power Rail Summary Legend -->
  <g transform="translate(120, 395)">
    <rect x="0" y="0" width="660" height="40" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="40" cy="20" r="6" fill="#DC2626"/>
    <text x="55" y="24" font-size="11" font-weight="600" fill="#374151">VCC Rails → 3.3V</text>

    <circle cx="210" cy="20" r="6" fill="#1F2937"/>
    <text x="225" y="24" font-size="11" font-weight="600" fill="#374151">GND Rails → Common Ground</text>

    <circle cx="430" cy="20" r="6" fill="#2563EB"/>
    <text x="445" y="24" font-size="11" font-weight="600" fill="#374151">Analog ADC1 Inputs (WiFi Safe)</text>
  </g>
</svg>
